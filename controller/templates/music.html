{% extends "base.html" %}
{% set page = "music" %}
{% block title %}Patterns — BlinkStick{% endblock %}
{% block content %}
<h2>Built-in Patterns</h2>
<div class="action-bar">
  <button class="btn" onclick="setMode('status')">Status</button>
  <div class="action-sep"></div>
  <button class="btn" data-preset="chase" onclick="playPreset('chase')">Chase</button>
  <button class="btn" data-preset="alternate" onclick="playPreset('alternate')">Alternate</button>
  <button class="btn" data-preset="rainbow" onclick="playPreset('rainbow')">Rainbow</button>
  <button class="btn" data-preset="flash" onclick="playPreset('flash')">Flash</button>
  <button class="btn" data-preset="police" onclick="playPreset('police')">Police</button>
  <div class="action-sep"></div>
  <button class="btn" data-action="all-off" onclick="allOff(this)">All off</button>
  <button class="btn danger" onclick="stopPlayback()">Stop</button>
</div>
<div class="form-row" style="justify-content:center">
  <div class="form-group" style="flex:0;min-width:80px">
    <label for="preset-bpm">BPM</label>
    <input type="number" id="preset-bpm" value="120" min="20" max="300">
  </div>
  <div class="form-group" style="flex:0;min-width:60px">
    <label for="preset-color">Color</label>
    <input type="color" id="preset-color" value="#00ff00">
  </div>
  <div class="form-group" style="flex:0;min-width:60px">
    <label for="preset-color2">Color 2</label>
    <input type="color" id="preset-color2" value="#0000ff">
  </div>
</div>

<div class="now-playing" id="now-playing" hidden></div>

<h2>Pattern Library</h2>
<div id="song-list"><div class="empty-state">Loading patterns...</div></div>

<h2>Pattern Editor</h2>

<div class="editor-tabs" role="tablist">
  <button class="ed-tab active" onclick="showVisual()" role="tab" aria-selected="true" id="tab-visual">Visual</button>
  <button class="ed-tab" onclick="showCode()" role="tab" aria-selected="false" id="tab-code">Code</button>
</div>

<!-- Visual mode -->
<div class="visual-pane active" id="visual-pane">
  <div class="meta-row">
    <div class="meta-field"><label>name</label><input id="meta-name" value="new-song"></div>
    <div class="meta-field"><label>title</label><input id="meta-title" value=""></div>
    <div class="meta-field"><label>author</label><input id="meta-author" value=""></div>
  </div>
  <div class="timing-row">
    <div class="timing-field"><label>bpm</label><input type="number" id="timing-bpm" value="120" min="20" max="300"></div>
    <div class="timing-field"><label>loop</label><select id="timing-loop"><option value="no">no</option><option value="yes">yes</option></select></div>
    <div class="timing-field"><label>transition</label><select id="timing-transition"><option value="solid">solid</option><option value="morph">morph</option></select></div>
    <div class="timing-field"><label>on end</label><select id="timing-onend"><option value="status">status</option><option value="direct">direct</option></select></div>
  </div>

  <div id="editor-palette"></div>
  <div id="editor-grid"><div class="empty-state">Loading editor...</div></div>

  <div class="editor-actions">
    <button class="btn" onclick="Editor.addBeat()">+ Beat</button>
    <button class="btn" onclick="Editor.addSection()">+ Section</button>
    <div class="action-sep"></div>
    <button class="btn primary" onclick="Editor.preview()">▶ Preview</button>
    <button class="btn danger" onclick="Editor.stop()">⬛ Stop</button>
    <div class="action-sep"></div>
    <button class="btn primary" onclick="Editor.save()">Save</button>
    <button class="btn" onclick="Editor.exportYaml()">Export YAML</button>
  </div>
</div>

<!-- Code mode -->
<div class="yaml-pane" id="yaml-pane">
  <textarea class="yaml-editor" id="yaml-editor" rows="20" placeholder="YAML beat sheet..."></textarea>
  <div class="parse-error" id="parse-error" hidden></div>
  <div class="editor-actions">
    <button class="btn primary" onclick="applyYaml()">Apply to grid</button>
    <button class="btn primary" onclick="Editor.preview()">▶ Preview</button>
    <button class="btn danger" onclick="Editor.stop()">⬛ Stop</button>
    <div class="action-sep"></div>
    <button class="btn primary" onclick="Editor.save()">Save</button>
    <button class="btn" onclick="Editor.exportYaml()">Export YAML</button>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="/static/js/editor.js"></script>
<script>
async function loadSongs() {
  const songs = await apiGet('/songs');
  const el = document.getElementById('song-list');
  if (!songs?.length) { el.innerHTML = '<div class="empty-state">No patterns yet — create one below or upload YAML</div>'; return; }
  el.innerHTML = songs.map(s => `
    <div class="song-item">
      <span class="song-name">${s.title || s.name}</span>
      <span class="song-meta">${s.bpm} bpm · ${s.source}</span>
      <button class="btn" onclick="Editor.loadSong('${s.name}')">Edit</button>
      <button class="btn" onclick="apiPost('/songs/${s.name}/play')">Play</button>
      <button class="btn danger" onclick="deleteSong('${s.name}', this)">Delete</button>
    </div>`).join('');
}
async function deleteSong(name, btn) {
  if (!btn.dataset.confirmed) {
    btn.textContent = 'Confirm?';
    btn.dataset.confirmed = '1';
    setTimeout(() => { btn.textContent = 'Delete'; delete btn.dataset.confirmed; }, 3000);
    return;
  }
  await apiDelete(`/songs/${name}`);
  loadSongs();
}
document.addEventListener('DOMContentLoaded', () => {
  loadSongs();
  Editor.init();
});
</script>
{% endblock %}
