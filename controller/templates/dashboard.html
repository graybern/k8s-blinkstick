{% extends "base.html" %}
{% set page = "dashboard" %}
{% block title %}Dashboard — BlinkStick{% endblock %}
{% block content %}
<div class="section-head" style="padding-top:0"><span class="section-title">Built-in Patterns</span></div>
<div class="action-bar" id="actions"></div>
<div class="now-playing" id="now-playing" hidden></div>
<div class="panels" id="panels"></div>
<section class="node-section" id="nodes"></section>

<!-- Inline mode switcher (popover) -->
<div class="mode-popover" id="mode-popover" hidden>
  <div class="section-head"><span class="section-title">Switch Mode</span><button class="alert-dismiss" onclick="document.getElementById('mode-popover').hidden=true">&times;</button></div>
  <div id="mode-cards"></div>
</div>
<section class="event-log">
  <div class="section-head"><span class="section-title">Activity</span></div>
  <div class="event-list" id="events"><div class="empty-state">Loading events...</div></div>
</section>
{% endblock %}
