{% extends "base.html" %}
{% set page = "direct" %}
{% block title %}Direct Control — BlinkStick{% endblock %}
{% block content %}
<h2>Direct LED Control</h2>
<p class="empty-state" id="mode-warning" hidden>Switch to direct mode first</p>
<div id="direct-controls"></div>
{% endblock %}
{% block scripts %}
<script>
async function loadDirect() {
  const modeResp = await apiGet('/modes/active');
  const warning = document.getElementById('mode-warning');
  if (modeResp.mode !== 'direct') {
    warning.hidden = false;
    warning.innerHTML = `Current mode: <b>${modeResp.mode}</b>. <button class="btn" onclick="enableDirect()">Switch to direct</button>`;
  } else {
    warning.hidden = true;
  }

  const nodes = await apiGet('/nodes');
  const el = document.getElementById('direct-controls');
  el.innerHTML = nodes.filter(n => n.present).map(n => `
    <div class="song-item">
      <span class="song-name">${n.name}</span>
      <input type="color" id="color-${n.name}" value="#00ff00" style="min-width:44px">
      <select id="effect-${n.name}" style="width:auto;min-width:80px">
        <option value="solid">solid</option>
        <option value="pulse">pulse</option>
        <option value="blink">blink</option>
      </select>
      <button class="btn" onclick="sendDirect('${n.name}', ${n.leds})">Apply</button>
    </div>`).join('');
}
async function enableDirect() {
  await apiPost('/modes/active', { mode: 'direct' });
  loadDirect();
}
async function sendDirect(node, ledCount) {
  const hex = document.getElementById(`color-${node}`).value;
  const effect = document.getElementById(`effect-${node}`).value;
  const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
  const leds = [];
  for (let i = 0; i < ledCount; i++) leds.push({ index: i, r, g, b });
  await apiPost('/direct', { action: 'set', leds, effect, params: {}, node });
}
document.addEventListener('DOMContentLoaded', loadDirect);
</script>
{% endblock %}
