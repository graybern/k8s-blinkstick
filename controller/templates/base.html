<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BlinkStick{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/music" class="{% if page == 'music' %}active{% endif %}">Music</a>
    <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">Settings</a>
    <div class="nav-spacer"></div>
    <div class="nav-status">
      <span class="ws-dot disconnected"></span>
      <span class="ws-time">--</span>
    </div>
    <select class="theme-select" id="theme-picker" aria-label="Theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="midnight">Midnight</option>
      <option value="terminal">Terminal</option>
    </select>
  </nav>
  <section class="led-section" id="led-strip"></section>
  <div id="alerts"></div>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
