<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BlinkStick{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/music" class="{% if page == 'music' %}active{% endif %}">Music</a>
    <a href="/modes" class="{% if page == 'modes' %}active{% endif %}">Modes</a>
    <a href="/direct" class="{% if page == 'direct' %}active{% endif %}">Direct</a>
    <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">Settings</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
